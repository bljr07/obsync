services:
  postgres-e2e:
    image: postgres:16
    environment:
      POSTGRES_USER: obsync_e2e
      POSTGRES_PASSWORD: obsync_e2e
      POSTGRES_DB: obsync_e2e
    ports:
      - "55432:5432"
    volumes:
      - pgdata-e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsync_e2e -d obsync_e2e"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - obsync-e2e

  redis-e2e:
    image: redis:7
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - obsync-e2e

networks:
  obsync-e2e:
    driver: bridge

volumes:
  pgdata-e2e:
